repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      # Linter.
      - id: ruff
        args:
          # Sort imports
          - --extend-select=I
          - --fix
          - --show-fixes
      # Formatter.
      - id: ruff-format

  - repo: https://github.com/python-trio/flake8-async
    rev: 25.7.1
    hooks:
      - id: flake8-async
        args:
          - --asyncio
          # ASYNC109 async function definition with a `timeout` parameter
          # ASYNC900 Async generator not allowed, unless transformed by a known decorator
          # ASYNC910 return from async function with no guaranteed checkpoint or exception
          # ASYNC911 exit from async iterable with no guaranteed checkpoint
          - --disable=ASYNC109,ASYNC900,ASYNC910,ASYNC911

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.6.2
    hooks:
      - id: prettier
        exclude: ^example/
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        additional_dependencies:
          - types-pyyaml
        # args:
        #   - --check-untyped-defs
        files: ^kubetemplatespawner
